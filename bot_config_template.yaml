# 微信智能助手配置（随安装包分发的模板，不含任何真实密钥）
# 首次启动网页会出"首次使用向导"引导填写；也可直接编辑本文件。
# 多账号隔离：登录后配置/数据库自动放到 %APPDATA%\wxbot\<你的wxid>\，换微信号登录自动换一套，互不串号。
app:
  dry_run: true                  # 演示模式：只记日志不真正发送（新装默认开，验证没问题再关！）
  self_wxid: ""                  # 程序登录后自动写入（多账号隔离标识），勿手填
  setup_done: false              # 首启向导完成标志，点"完成"后自动置 true
  web_port: 8778
  db_file: wxbot.db
llm:                             # 模型接口：任意 OpenAI 兼容网关（自建网关/智谱/百炼均可），私聊回复靠它生成
  provider: custom
  base_url: https://your-llm-gateway.example/v1
  api_key: your-api-key
  model: your-model
  temperature: 0.8
  timeout: 60
kb:                              # 知识库（可选）：群 @机器人 答疑走它 RAG；不配则群答疑降级/关闭
  url: https://your-kb-gateway.example/mcp
  api_key: your-kb-api-key
  kb: team
  # upload_tool: kb_upload    # 免@消息沉淀的上传工具名（可选；默认 kb_upload → kb_add_document → kb_add_file 顺序试探）
  top_k: 5
  timeout: 60
  miss_markers:
  - 未查询到
  - 无法回答
  - 没有找到
  - 未找到相关
  - 未提及
  - 无相关内容
  - 未提供
ocr:                             # 图片识别（可选）：群里图片 OCR 成文字参与理解；不配则图片只显示 [图片]
  url: http://your-ocr-service.example:18765
  api_key: your-ocr-api-key
  timeout: 30
reply:
  poll_sec: 3
  quiesce_sec: 5
  human_delay:
  - 2
  - 5
  history_limit: 16
  max_replies: 500
  max_runtime_min: 0
admins:
- wxid_your_admin_id
personas:
  老友幽默:
    style: 口语化、简短（20~60字）、幽默爱接梗、常用两个空格分隔短句、偶尔用[呲牙][机智][破涕为笑][强]表情码（每条最多1个）
    background: 对方是多年老同事老朋友，常聊共同经历的行业梗
  老婆家常:
    style: 结婚多年老夫老妻日常，消息很短（5~30字）、务实直接、偶尔贫嘴、很少用表情码；对方嗔怪就顺着自嘲带过，别辩解
    background: 常聊家务、买东西、家里大小事
  通用朋友:
    style: 口语化、简短（10~40字）、随和自然，偶尔幽默，不用表情码也行
    background: 对方是普通朋友/同事，保持礼貌但不客套
  群管家-热心:
    style: 群管理消息口吻：客气、清楚、带点人情味，一句话说明问题，给出提醒，不阴阳怪气
    background: 你在帮群主维护技术交流群秩序，劝告以引导为主
  群管家-严肃:
    style: 群管理消息口吻：简短、明确、公事公办，直接指出违反群规并警告，不绕弯
    background: 你在帮群主维护技术交流群秩序，规则至上
contacts:
- id: wxid_xxx
  display: 好友昵称
  persona: 通用朋友
  enabled: false
groups:
- id: 12345678@chatroom
  display: 测试群
  enabled: false
  persona: 老友幽默
  mention_names: []
  mine: false                  # 自动增量挖掘群历史 → 网页"挖掘"区查看/导出
  no_at_reply: false           # 免@接话：没人@机器人时也按最近聊天判断是否主动回复（默认关）
  no_at_context: 20            # 免@判断参考的最近消息条数（含触发消息，默认 20）
  no_at_cooldown_min: 3        # 免@回复冷却分钟数（期间不重复接话；@提问不受限，默认 3）
  qa:
    enabled: true
    grounded_reply: true
    llm_fallback: false
  manage:
    welcome: true
    welcome_text: 欢迎 {name} 入群！有问题可以直接 @我 提问～
    forbidden_words:
    - 广告
    - 刷单
    warn_persona: 群管家-热心
    warn_threshold: 2
