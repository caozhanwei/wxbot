# 微信智能助手配置（随安装包分发的模板，不含任何真实密钥）
# 首次启动网页会出"首次使用向导"引导填写；也可直接编辑本文件。
# 多账号隔离：登录后配置/数据库自动放到 %APPDATA%\wxbot\<你的wxid>\，换微信号登录自动换一套，互不串号。
app:
  dry_run: true                  # 演示模式：只记日志不真正发送（新装默认开，验证没问题再关！）
  self_wxid: ""                  # 程序登录后自动写入（多账号隔离标识），勿手填
  setup_done: false              # 首启向导完成标志，点"完成"后自动置 true
  web_port: 8778
  db_file: wxbot.db
  auto_profile_hours: 0          # 定时增量画像：>0 时每 N 小时自动刷新启用群的活跃成员画像（0=关）
  update_mirror: ""              # 升级镜像源覆盖项：留空=用程序内置国内镜像（推荐，GitHub 不稳环境开箱即用）；
                                 # 也可填自己的镜像 URL；镜像不可用自动回落 GitHub
  missed_private:                # 非白名单私聊被动监控：只记入"补报缓存"绝不回复；急件（含 急/紧急/尽快 等词）即时推送
    enabled: true                # 设 false 关闭；文件传输助手/公众号/自己永不监控
  daily_digest:                  # 每晚群精华日报：AI 热点摘要 + 未解问题 + 找你的事（@我未答/私聊找你）
    enabled: false               # 总开关（默认关；群还要在群配置勾"进日报"才出小节）
    hour: 21                     # 发送时刻（0~23）；错过开机当天会补发，跨天不补
    push_to: 文件传输助手          # 日报/急件推给谁
  weekly_report:                 # 群活跃周报：近7天发言量/活跃人数/本周沉淀/待解决+热点摘要
    enabled: false               # 总开关（默认关，开启后所有启用群都进周报）
    weekday: 0                   # 周几发（0=周一 … 6=周日）
    hour: 9                      # 发送时刻（0~23）
    push_to: 文件传输助手          # 周报推给谁
  gate:                          # 主动动作闸门：日报/急件等机器人主动发送统一过闸，防刷屏
    enabled: true
    hourly_max: 20               # 全局每小时最多主动发几条（0=不限）
    per_chat_daily_max: 30       # 每个会话每天最多几条（0=不限）
    window: [8, 22]              # 允许主动发送的时段（小时，含头不含尾）；急件豁免时段窗
                                 # 急停用管理员命令：#急停主动 / #恢复主动
  console:                       # 主人对话台：在"文件传输助手"里发消息=直接问助手（跨群/私聊记录检索问答）
    enabled: true                # 设 false 关闭；# 开头仍走管理员命令；对话台回复不受闸门/暂停限制
  care:                          # 主动关怀：好久没聊的好友按记忆点生成问候（新装默认演练，只记日志不真发）
    enabled: false               # 总开关；dry_run: true 时只在日志里演练话术，确认靠谱再改 false
    dry_run: true
    hour: 10                     # 每天几点挑人发（配合闸门 8~22 点时段窗）
    days_min: 7                  # 超过 N 天没聊过才算"好久没聊"
    max_per_day: 3               # 每天最多关怀几人；每人每周最多 1 次（内置）
  watchdog:                      # 自愈守护：微信进程监测告警 + 掉线告警 + bot 崩溃自动重启
    restart_wechat: false        # 微信进程不在时自动拉起（默认只告警管理员，避免误拉旧版/多开）
    bot_restart: true            # bot 异常退出后 30~60 秒自动重启（开机自启在网页「自愈守护」卡片开）
llm:                             # 模型接口：任意 OpenAI 兼容网关（自建网关/智谱/百炼均可），私聊回复靠它生成
  provider: custom
  base_url: https://your-llm-gateway.example/v1
  api_key: your-api-key
  model: your-model
  temperature: 0.8
  timeout: 60
kb:                              # 知识库（可选）：群 @机器人 答疑走它 RAG；不配则群答疑降级/关闭
  url: https://your-kb-gateway.example/mcp
  api_key: your-kb-api-key
  kb: team
  # upload_tool: kb_upload    # 免@消息沉淀的上传工具名（可选；默认 kb_upload → kb_add_document → kb_add_file 顺序试探）
  top_k: 5
  timeout: 60
  miss_markers:
  - 未查询到
  - 无法回答
  - 没有找到
  - 未找到相关
  - 未提及
  - 无相关内容
  - 未提供
ocr:                             # 图片识别（可选）：群里图片 OCR 成文字参与理解；不配则图片只显示 [图片]
  url: http://your-ocr-service.example:18765
  api_key: your-ocr-api-key
  timeout: 30
asr:                             # 语音识别（可选）：语音转文字参与理解；不配则语音只显示 [语音]
  url: https://your-asr-service.example/v1/audio/transcriptions
  api_key: your-asr-api-key
  model: whisper-1
  timeout: 30
reply:
  poll_sec: 1.5
  quiesce_sec: 5
  human_delay:
  - 2
  - 5
  history_limit: 16
  max_replies: 500
  max_runtime_min: 0
admins:
- wxid_your_admin_id
personas:
  老友幽默:
    style: 口语化、简短（20~60字）、幽默爱接梗、常用两个空格分隔短句、偶尔用[呲牙][机智][破涕为笑][强]表情码（每条最多1个）
    background: 对方是多年老同事老朋友，常聊共同经历的行业梗
  老婆家常:
    style: 结婚多年老夫老妻日常，消息很短（5~30字）、务实直接、偶尔贫嘴、很少用表情码；对方嗔怪就顺着自嘲带过，别辩解
    background: 常聊家务、买东西、家里大小事
  通用朋友:
    style: 口语化、简短（10~40字）、随和自然，偶尔幽默，不用表情码也行
    background: 对方是普通朋友/同事，保持礼貌但不客套
  群管家-热心:
    style: 群管理消息口吻：客气、清楚、带点人情味，一句话说明问题，给出提醒，不阴阳怪气
    background: 你在帮群主维护技术交流群秩序，劝告以引导为主
  群管家-严肃:
    style: 群管理消息口吻：简短、明确、公事公办，直接指出违反群规并警告，不绕弯
    background: 你在帮群主维护技术交流群秩序，规则至上
contacts:
- id: wxid_xxx
  display: 好友昵称
  persona: 通用朋友
  enabled: false
groups:
- id: 12345678@chatroom
  display: 测试群
  enabled: false
  persona: 老友幽默
  mention_names: []
  mine: false                  # 自动增量挖掘群历史 → 网页"挖掘"区查看/导出
  digest:                      # 群精华日报（需 app.daily_digest.enabled 也开）
    enabled: false             # 勾选后该群每晚出小节：AI 热点摘要 + 未解问题 + @我未答
  no_at_reply: false           # 免@接话：没人@机器人时也按最近聊天判断是否主动回复（默认关）
  active: false                # 活跃分子：免@不做“值不值得”智能判定，冷却一过就像群友一样自然接话（冷却仍节流）
  no_at_context: 20            # 免@判断参考的最近消息条数（含触发消息，默认 20）
  no_at_cooldown_min: 3        # 免@回复冷却分钟数（期间不重复接话；@提问不受限，默认 3，支持 0.1 分钟步进）
  no_at_quote: true            # 免@接话用微信引用回复点明在答谁；触发消息被顶出屏幕会自动向上翻找（约5屏内）
  qa:
    enabled: true
    grounded_reply: true
    llm_fallback: false
    local_first: true             # 群精华主题库先撞：该群沉淀过的问答直接转述作答（标"群内沉淀"），不查知识库；设 false 关闭
  manage:
    welcome: true
    welcome_text: 欢迎 {name} 入群！有问题可以直接 @我 提问～
    forbidden_words:
    - 广告
    - 刷单
    warn_persona: 群管家-热心
    warn_threshold: 2
    order:                        # 群秩序：只告警不动人，踢人走 #踢 人工二次确认
      flood_max: 10               # 1 分钟连发超 N 条判定刷屏告警（0=关）
      ads_watch: true             # 新成员 24h 内广告嫌疑观察（告警附 #踢 指令）
