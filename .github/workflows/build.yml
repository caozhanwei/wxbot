name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
          pip install -e vendor/wechatauto-replica

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build exe (PyInstaller)
        run: pyinstaller wxbot.spec --noconfirm

      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${env:GITHUB_REF_NAME}".TrimStart('v')
          (Get-Content build/product.wxs -Raw -Encoding utf8) -replace 'Version="\d+\.\d+\.\d+"', "Version=`"$v`"" | Set-Content build/product.wxs -Encoding utf8 -NoNewline
          Select-String -Path build/product.wxs -Pattern 'Version='

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build MSI
        working-directory: build
        shell: pwsh
        run: |
          python gen_files.py ../dist/wxbot
          wix build -arch x64 '-define SourceDir=../dist/wxbot' product.wxs files.wxs -o wxbot.msi
          Get-Item wxbot.msi | Select-Object Name, Length

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: wxbot-msi
          path: build/wxbot.msi
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          Copy-Item build/wxbot.msi "wxbot-$tag.msi"
          gh release create $tag "wxbot-$tag.msi" --title "wxbot $tag" --generate-notes
